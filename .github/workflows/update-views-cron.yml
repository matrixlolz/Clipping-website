name: Daily View Updates

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-views:
    runs-on: ubuntu-latest
    
    steps:
      - name: Update All Submission Views
        run: |
          echo "Triggering daily view update..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://htkcortbngtlkjkmgbca.supabase.co/functions/v1/update-all-views" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: Edge function returned non-200 status"
            exit 1
          fi
          
          echo "Daily view update completed successfully!"
